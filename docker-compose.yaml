version: '3.8'

services:
  # ==========================================
  # INFRAE (Banco, Cache, Mensageria)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: monevo_db
    environment:
      POSTGRES_USER: niches
      POSTGRES_PASSWORD: "1969"
      POSTGRES_DB: users_monevo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql # Cria os demais bancos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niches -d users_monevo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monevo_redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: monevo_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # ==========================================
  # MICROSERVIÇOS
  # ==========================================
  gateway:
    build:
      context: ./gateway-monevo
    container_name: gateway_api
    ports:
      - "9090:9090"
    environment:
      USER_AUTH_URL: http://user-auth:8080
      WALLET_URL: http://wallet:8082
      MARKET_DATA_URL: http://market-data:8081
    depends_on:
      - user-auth
      - market-data
      - wallet

  user-auth:
    build:
      context: ./userAuth
    container_name: user_auth_api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/users_monevo
      SPRING_DATASOURCE_USERNAME: niches
      SPRING_DATASOURCE_PASSWORD: "1969"
      JWT_KEY: ${JWT_KEY}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy

  market-data:
    build:
      context: ./market-data
    container_name: market_data_api
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/teste
      SPRING_DATASOURCE_USERNAME: niches
      SPRING_DATASOURCE_PASSWORD: "1969"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  wallet:
    build:
      context: ./monevo-wallet
    container_name: wallet_api
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wallet_monevo
      SPRING_DATASOURCE_USERNAME: niches
      SPRING_DATASOURCE_PASSWORD: "1969"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_KEY: ${JWT_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: