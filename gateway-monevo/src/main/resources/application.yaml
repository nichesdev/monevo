server:
  port: 9090

spring:
  application:
    name: gateway-monevo
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webmvc:
          routes:
            - id: user_auth
              uri: ${USER_AUTH_URL:http://localhost:8080}
              predicates:
                - Path=/monevo/auth/**
