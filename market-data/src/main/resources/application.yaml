server:
  port: 8081

spring:
  application:
    name: market-data

  datasource:
    url: jdbc:postgresql://localhost:5432/teste
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms
      client-type: lettuce
      lettuce:
        shutdown-timeout: 100ms

  market:
    coins: USD-BRL,CAD-BRL,EUR-BRL,GBP-BRL,BTC-BRL,ETH-BRL